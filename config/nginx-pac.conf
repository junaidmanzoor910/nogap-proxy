# Nginx serves PAC over TLS on ${PAC_HTTPS_PORT}. Not used for CONNECT forward-proxy traffic.

server {
    listen ${PAC_HTTPS_PORT} ssl;
    server_name ${PROXY_HOSTNAME};

    ssl_certificate     /etc/squid/tls/fullchain.pem;
    ssl_certificate_key /etc/squid/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # No request logging of Authorization headers (PAC endpoint is unauthenticated by design).
    access_log /var/log/nginx/pac.access.log combined;
    error_log  /var/log/nginx/pac.error.log warn;

    location = /proxy.pac {
        alias /var/www/pac/proxy.pac;
        default_type application/x-ns-proxy-autoconfig;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        return 404;
    }
}
