# Nginx Disguise Site: Listens internally on 127.0.0.1:8443
# OpenVPN's `port-share 127.0.0.1 8443` routes any non-VPN HTTPS traffic here.
# Anyone probing port 443 with a browser or scanner receives a genuine TLS response.

server {
    listen 127.0.0.1:8443 ssl default_server;
    server_name _;

    ssl_certificate /etc/openvpn/server/disguise.crt;
    ssl_certificate_key /etc/openvpn/server/disguise.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/disguise;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hide Nginx version
    server_tokens off;
}
